name: CI

on:
  # Every branch, not just main: work lands on feature branches in chunks, and
  # each chunk should be verified as it is pushed rather than only at merge.
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on warnings rather than letting them accumulate.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test, validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain, components, and wasm target all come from
      # rust-toolchain.toml, so there is one source of truth for them.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # Guards against malformed building data reaching main. Passes cleanly
      # while data/buildings is still empty (Phase 1 populates it).
      - name: Validate building data
        run: cargo run -p xtask -- validate-data
