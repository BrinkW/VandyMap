[workspace]
members = ["app", "campus_data", "xtask"]
# `app` targets wasm32 via the Dioxus web renderer, so building it for the host
# during a plain `cargo test`/`cargo clippy` is slow at best and confusing at
# worst. Those commands stay scoped to the portable crates; CI checks the app
# explicitly against wasm32 instead (see .github/workflows/ci.yml).
default-members = ["campus_data", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/BrinkW/VandyMap"

[workspace.dependencies]
campus_data = { path = "campus_data" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock", "wasmbind"] }
chrono-tz = { version = "0.10", features = ["serde"] }
thiserror = "2"
